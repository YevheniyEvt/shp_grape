default_install_hook_types: [pre-commit, commit-msg]

repos:
  # pre-commit-hooks run as Python modules from the project venv (dev dependency), not as
  # the .exe launchers of a pre-commit-managed environment: Windows Smart App Control
  # blocks those freshly built, unsigned launchers.
  - repo: local
    hooks:
      - id: check-yaml
        name: check yaml
        entry: uv run --frozen python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: uv run --frozen python -m pre_commit_hooks.check_toml
        language: system
        types: [toml]
      - id: check-json
        name: check json
        entry: uv run --frozen python -m pre_commit_hooks.check_json
        language: system
        types: [json]
        exclude: ^frontend/tsconfig\.json$
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
        exclude: \.po$
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
        exclude: \.(po|md)$
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run --frozen python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]
      - id: check-added-large-files
        name: check for added large files
        entry: uv run --frozen python -m pre_commit_hooks.check_added_large_files --maxkb=1024
        language: system

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: frontend-messages
        name: frontend translation catalogs up to date
        entry: uv run --frozen manage.py makemessages_frontend --check
        language: system
        files: ^(frontend/src/|locale/)
        pass_filenames: false
      - id: commitizen
        name: commitizen check
        entry: uv run --frozen cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: prettier
        name: prettier (frontend)
        entry: node frontend/scripts/run-in-frontend.mjs prettier --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/(src/types/api\.ts|package-lock\.json)$
      - id: eslint
        name: eslint (frontend)
        entry: node frontend/scripts/run-in-frontend.mjs eslint --no-warn-ignored
        language: system
        files: ^frontend/.*\.(ts|tsx|mts|js|mjs)$
