name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: shp_grape
          POSTGRES_USER: shp_grape
          POSTGRES_PASSWORD: shp_grape
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shp_grape"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://shp_grape:shp_grape@localhost:5432/shp_grape
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run manage.py makemessages_frontend --check
      - run: just compilemessages
      - run: uv run manage.py makemigrations --check --dry-run
      - run: just test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
